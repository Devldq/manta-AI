<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manta AI 数据位置</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;background:#0b0f14;color:#f4f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#173c36 0,transparent 48%),#0b0f14}
    main{width:min(640px,calc(100% - 40px));margin:32px auto;padding:28px 30px 24px;background:rgba(20,27,35,.94);border:1px solid #29343f;border-radius:18px;box-shadow:0 22px 70px rgba(0,0,0,.34)}
    .eyebrow{margin:0 0 8px;color:#65dca8;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:27px;letter-spacing:-.02em}
    .intro{margin:10px 0 18px;color:#b9c3ce;line-height:1.6}
    code{padding:2px 6px;border-radius:5px;background:#222c36;color:#dff9ed}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
    button{min-height:42px;padding:0 16px;border:1px solid #35424f;border-radius:9px;background:#222b35;color:#eaf0f6;font:inherit;font-weight:650;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s}
    button:hover:not(:disabled){background:#2a3641;border-color:#4a5a68}
    button:focus-visible{outline:3px solid rgba(101,220,168,.35);outline-offset:2px}
    button:disabled{cursor:not-allowed;opacity:.42}
    #confirm{border-color:#65dca8;background:#65dca8;color:#07140f}
    #confirm:hover:not(:disabled){background:#7be7b8}
    #quit{margin-left:auto;background:transparent}
    #status{min-height:22px;margin:0 2px 14px;color:#afbac6;font-size:14px}
    #status.error{color:#ff9b9b}
    #progress-panel{padding:10px 14px 8px;border:1px solid #2b3742;border-radius:13px;background:#10161d}
    #progress-panel[hidden]{display:none}
    #progress-title{margin:0 0 5px;color:#dfe7ee;font-size:13px;font-weight:700}
    #progress-list{list-style:none;margin:0;padding:0}
    .progress-row{display:flex;gap:12px;align-items:flex-start;min-height:38px;padding:8px 3px;border-top:1px solid rgba(67,82,95,.35);color:#778390}
    .progress-row:first-child{border-top:0}
    .progress-marker{display:grid;place-items:center;flex:0 0 20px;width:20px;height:20px;margin-top:1px;border:1px solid #3a4652;border-radius:50%;font-size:13px;font-weight:800}
    .progress-copy{display:flex;min-width:0;flex-direction:column;gap:2px}
    .progress-label{font-size:14px;line-height:21px}
    .progress-error{color:#ff9b9b;font-size:12px;line-height:17px}
    .is-active{color:#f5f8fb}
    .is-active .progress-marker{border:2px solid #31594b;border-top-color:#65dca8;animation:spin .8s linear infinite}
    .is-complete{color:#cfe9dc}
    .is-complete .progress-marker{border-color:#397a61;background:#173c30;color:#78e0b1}
    .is-failed{color:#ffd2d2}
    .is-failed .progress-marker{border-color:#874848;background:#3b2023;color:#ff9b9b}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.is-active .progress-marker{animation:none;border-color:#65dca8}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Manta AI Data</p>
    <h1>设置 Manta AI 数据位置</h1>
    <p class="intro">请选择 Manta AI 数据文件夹。你可以选择一个空文件夹来保存新数据，也可以直接选择以前使用的数据文件夹继续使用。</p>
    <div class="actions">
      <button id="choose" type="button">选择文件夹</button>
      <button id="confirm" type="button" disabled>创建并启动</button>
      <button id="quit" type="button">退出</button>
    </div>
    <p id="status" role="status" aria-live="polite">尚未选择存储位置</p>
    <section id="progress-panel" aria-labelledby="progress-title" hidden>
      <h2 id="progress-title">初始化进度</h2>
      <ol id="progress-list"></ol>
    </section>
  </main>
  <script src="./index.js"></script>
</body>
</html>
