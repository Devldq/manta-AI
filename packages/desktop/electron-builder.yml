appId: com.manta.desktop
productName: Manta
directories:
  output: dist

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend/dist
  - from: ../backend/dist
    to: backend/dist
  - from: ../storage-hub/dist
    to: storage-hub/dist
  - from: ../rag/dist
    to: rag/dist
  - from: ../../.manta
    to: .manta

asarUnpack:
  - node_modules/**/better-sqlite3/**/*
  - node_modules/**/sqlite-vec/**/*

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
