services:
  manta:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${MANTA_PORT:-3000}:3000"
    volumes:
      - manta-data:/data
    environment:
      - MANTA_PORT=3000
      - MANTA_HOST=0.0.0.0
      - MANTA_DATA_DIR=/data
      - NODE_ENV=production
      # LLM 配置（按需设置）
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  manta-data:
    driver: local
  qdrant-data:
    driver: local
