name: ASH Phase 1

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  verify-phase1:
    name: ${{ matrix.os }} ASH Phase 1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:ash:phase1
